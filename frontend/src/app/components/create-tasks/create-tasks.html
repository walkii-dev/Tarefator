<div class="form-container">
  <form>

    <div class="form-group">
      <input
        type="text"
        class="input-primary"
        formControlName="title"
        placeholder="Qual será sua próxima tarefa?"
      >
    </div>

    <div class="form-group">
      <textarea
        class="input-primary textarea-detail"
        formControlName="description"
        placeholder="Informe mais detalhes..."
      ></textarea>
    </div>

    <div class="datetime-row">

      <div class="datetime-group">
        <label class="label">Data:</label>
        <div class="inputs-wrapper">
          <input type="text" class="input-small" placeholder="DD" maxlength="2" formControlName="day">
          <input type="text" class="input-small" placeholder="MM" maxlength="2" formControlName="month">
          <input type="text" class="input-medium" placeholder="AAAA" maxlength="4" formControlName="year">
        </div>
      </div>

      <div class="datetime-group">
        <label class="label">Hora:</label>
        <div class="inputs-wrapper">
          <input type="text" class="input-small" placeholder="HH" maxlength="2" formControlName="hour">
          <input type="text" class="input-small" placeholder="MM" maxlength="2" formControlName="minute">
        </div>
      </div>

    </div>

    <div class="actions-row">
      <button type="submit" class="btn btn-save">Salvar</button>
      <button type="button" class="btn btn-cancel" (click)="cancelTask()">Cancelar</button>
    </div>

  </form>
</div>
